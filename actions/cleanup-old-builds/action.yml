name: 'Cleanup Old Build Versions'
description: 'Deletes old .build.* releases, stale draft releases, their tags, and the npm/nuget/container package versions they published'
author: 'CPDevTools'

branding:
  icon: 'trash-2'
  color: 'red'

inputs:
  days-old:
    description: 'Delete builds/drafts older than X days'
    required: false
    default: '14'

  dry-run:
    description: 'Dry run (show what would be deleted without deleting)'
    required: false
    default: 'false'

  token:
    description: 'GitHub token with packages:write and contents:write'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        # Explicit version, unlike the other actions: the reusable cleanup
        # workflow never checks the consumer repo out, so there is no workspace
        # package.json for action-setup to read a packageManager from ("No pnpm
        # version is specified"). package_json_file cannot point here either —
        # action-setup joins it onto GITHUB_WORKSPACE, and github.action_path
        # lives outside it. Keep in sync with packageManager in this action's
        # package.json.
        version: 11.5.0

    # The workspace lockfile resolves @cpdevtools/* from npm.pkg.github.com,
    # which requires a token even to read package metadata. Without it pnpm's
    # supply-chain check cannot verify those entries against the registry and
    # fails with ERR_PNPM_TARBALL_URL_MISMATCH before the tarballs are fetched.
    # Matches actions/build-pack.
    - name: Configure registry auth
      shell: bash
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-cleanup-old-builds
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Cleanup releases, tags and packages
      shell: bash
      run: |
        ${{ github.action_path }}/node_modules/.bin/tsx \
          --tsconfig ${{ github.action_path }}/tsconfig.json \
          ${{ github.action_path }}/src/action.ts
      env:
        GH_TOKEN: ${{ inputs.token }}
        DRY_RUN: ${{ inputs.dry-run }}
        DAYS_OLD: ${{ inputs.days-old }}
