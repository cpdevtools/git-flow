name: 'Cleanup Old Build Versions'
description: 'Deletes old .build.* releases, stale draft releases, their tags, and the npm/nuget/container package versions they published'
author: 'CPDevTools'

branding:
  icon: 'trash-2'
  color: 'red'

inputs:
  days-old:
    description: 'Delete builds/drafts older than X days'
    required: false
    default: '14'

  dry-run:
    description: 'Dry run (show what would be deleted without deleting)'
    required: false
    default: 'false'

  token:
    description: 'GitHub token with packages:write and contents:write'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-cleanup-old-builds
      env:
        HUSKY: '0'

    - name: Cleanup releases, tags and packages
      shell: bash
      run: |
        ${{ github.action_path }}/node_modules/.bin/tsx \
          --tsconfig ${{ github.action_path }}/tsconfig.json \
          ${{ github.action_path }}/src/action.ts
      env:
        GH_TOKEN: ${{ inputs.token }}
        DRY_RUN: ${{ inputs.dry-run }}
        DAYS_OLD: ${{ inputs.days-old }}
