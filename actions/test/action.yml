name: 'Test Projects'
description: 'Runs build/test scripts across workspace projects in dependency order'
author: 'CPDevTools'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: 'Test mode: build (build only), test (test only), or test-optional (both where available)'
    required: false
    default: 'test-optional'

  fail-fast:
    description: 'Stop on first failure, cancelling in-flight tasks'
    required: false
    default: 'false'

  concurrency:
    description: 'Maximum number of projects to run in parallel (default: unlimited)'
    required: false
    default: ''

  token:
    description: 'GitHub token (used for installing packages)'
    required: false
    default: ${{ github.token }}

  workspace-root:
    description: 'Workspace root directory'
    required: false
    default: ${{ github.workspace }}

outputs:
  projects-passed:
    description: 'Number of projects that passed'
    value: ${{ steps.test.outputs.projects-passed }}

  projects-failed:
    description: 'Number of projects that failed'
    value: ${{ steps.test.outputs.projects-failed }}

  projects-skipped:
    description: 'Number of projects skipped due to a dependency failure'
    value: ${{ steps.test.outputs.projects-skipped }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Configure registry auth
      shell: bash
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --lockfile-dir .pnpm-prod
      env:
        HUSKY: '0'
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod --no-frozen-lockfile
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Run Tests
      id: test
      shell: bash
      run: ${{ github.action_path }}/node_modules/.bin/tsx ${{ github.action_path }}/src/action.ts
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_WORKSPACE_ROOT: ${{ inputs.workspace-root }}
        GITHUB_TOKEN: ${{ inputs.token }}
