name: 'Test Projects'
description: 'Runs build/test scripts across workspace projects in dependency order'
author: 'CPDevTools'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: 'Test mode: build (build only), test (test only), or test-optional (both where available)'
    required: false
    default: 'test-optional'

  fail-fast:
    description: 'Stop on first failure, cancelling in-flight tasks'
    required: false
    default: 'false'

  concurrency:
    description: 'Maximum number of projects to run in parallel (default: unlimited)'
    required: false
    default: ''

  token:
    description: 'GitHub token (used for installing packages)'
    required: false
    default: ${{ github.token }}

  workspace-root:
    description: 'Workspace root directory'
    required: false
    default: ${{ github.workspace }}

outputs:
  projects-passed:
    description: 'Number of projects that passed'
    value: ${{ steps.test.outputs.projects-passed }}

  projects-failed:
    description: 'Number of projects that failed'
    value: ${{ steps.test.outputs.projects-failed }}

  projects-skipped:
    description: 'Number of projects skipped due to a dependency failure'
    value: ${{ steps.test.outputs.projects-skipped }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Configure registry auth
      shell: bash
      # verifyDepsBeforeRun=false: its default is "install", so every workspace
      # project's `pnpm run` otherwise shells a full `pnpm install` before its
      # script. The setup step already installs once from .pnpm-prod; with
      # projects running in parallel those redundant per-project installs race on
      # the shared store and fail the job intermittently (pnpm `.bin` mkdir
      # ENOENT, dotnet first-run NuGet-Migrations EEXIST). Matches actions/build-pack.
      run: |
        pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
        pnpm config set "verifyDepsBeforeRun" "false"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    # Project builds may pull private base images from ghcr.io. Skipped on runners
    # without docker so non-container repos don't require it.
    - name: Configure container registry auth
      shell: bash
      run: |
        command -v docker >/dev/null || exit 0
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --lockfile-dir .pnpm-prod
      env:
        HUSKY: '0'
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-test...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    # .NET first-time-use warm-up. On the very first `dotnet` invocation on a
    # machine, NuGet's MigrationRunner creates a named mutex "NuGet-Migrations"
    # (only while its marker ~/.local/share/NuGet/Migrations/1 is missing). Two
    # same-level projects that both start with `dotnet restore` in parallel race
    # on that mutex in the .NET 6 runtime's shm-file implementation and one dies
    # with IOException/EEXIST. Running one real CLI command serially first writes
    # the marker so the mutex is never created again. `dotnet --version/--info`
    # may short-circuit before ConfigureDotNetForFirstTimeUse, hence `nuget locals`.
    # DOTNET_NOLOGO/TELEMETRY_OPTOUT only keep it quiet; they do not skip migration.
    - name: Warm up dotnet first-time-use
      shell: bash
      run: |
        command -v dotnet >/dev/null 2>&1 || exit 0
        dotnet nuget locals all --list >/dev/null 2>&1 || true
        if [ -e "$HOME/.local/share/NuGet/Migrations/1" ]; then
          echo "dotnet first-time-use complete (NuGet migration marker present)."
        else
          echo "::notice::NuGet migration marker not found at ~/.local/share/NuGet/Migrations/1 after warm-up; parallel dotnet restores may still race on NuGet-Migrations."
        fi
      env:
        DOTNET_NOLOGO: '1'
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    - name: Run Tests
      id: test
      shell: bash
      run: ${{ github.action_path }}/node_modules/.bin/tsx ${{ github.action_path }}/src/action.ts
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_WORKSPACE_ROOT: ${{ inputs.workspace-root }}
        GITHUB_TOKEN: ${{ inputs.token }}
