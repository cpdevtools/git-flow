name: 'Build & Pack Projects'
description: 'Phase 2: Builds and packages projects from release PR, creates draft releases with artifacts'
author: 'CPDevTools'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  pr-number:
    description: 'Pull request number containing release metadata'
    required: false
    default: '0'
  
  token:
    description: 'GitHub token with release permissions'
    required: false
    default: ${{ github.token }}
  
  workspace-root:
    description: 'Workspace root directory'
    required: false
    default: ${{ github.workspace }}

outputs:
  projects-built:
    description: 'Number of projects successfully built'
    value: ${{ steps.build-pack.outputs.projects-built }}
  
  projects-packed:
    description: 'Number of projects successfully packed'
    value: ${{ steps.build-pack.outputs.projects-packed }}
  
  projects-uploaded:
    description: 'Number of projects successfully uploaded'
    value: ${{ steps.build-pack.outputs.projects-uploaded }}
  
  projects-skipped:
    description: 'Number of projects skipped (already completed)'
    value: ${{ steps.build-pack.outputs.projects-skipped }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    
    - name: Configure registry auth
      shell: bash
      run: |
        pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
        pnpm config set "verifyDepsBeforeRun" "false"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    # Project builds may pull private base images from ghcr.io. Skipped on runners
    # without docker so non-container repos don't require it.
    - name: Configure container registry auth
      shell: bash
      run: |
        command -v docker >/dev/null || exit 0
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --lockfile-dir .pnpm-prod
      env:
        HUSKY: '0'
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Add workspace bin to PATH
      shell: bash
      run: echo "${{ inputs.workspace-root }}/node_modules/.bin" >> $GITHUB_PATH

    # Only meaningful when this action runs inside the git-flow workspace itself,
    # where the CLI is a workspace member rather than an installed dependency.
    - name: Use workspace-local git-flow-cli if present
      shell: bash
      working-directory: ${{ inputs.workspace-root }}
      run: |
        set -euo pipefail
        if [ ! -f packages/git-flow-cli/package.json ]; then
          echo "git-flow-cli is not a workspace member — using the installed @cpdevtools/git-flow-cli."
          if [ ! -x node_modules/.bin/gitflow ]; then
            echo "::error::gitflow binary not found. Add @cpdevtools/git-flow-cli to the workspace root devDependencies."
            exit 1
          fi
          exit 0
        fi
        pnpm --filter @cpdevtools/git-flow-cli build
        chmod +x packages/git-flow-cli/dist/bin.js
        ln -sf "$(pwd)/packages/git-flow-cli/dist/bin.js" node_modules/.bin/gitflow
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-build-pack...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Run Build & Pack
      shell: bash
      run: ${{ github.action_path }}/node_modules/.bin/tsx --tsconfig ${{ github.action_path }}/tsconfig.json ${{ github.action_path }}/src/action.ts
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_WORKSPACE_ROOT: ${{ inputs.workspace-root }}
        INPUT_ARTIFACT_OUTPUT_DIR: ${{ inputs.artifact-output-dir }}
