name: 'Build & Pack Projects'
description: 'Phase 2: Builds and packages projects from release PR, creates draft releases with artifacts'
author: 'CPDevTools'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  pr-number:
    description: 'Pull request number containing release metadata'
    required: false
    default: '0'
  
  token:
    description: 'GitHub token with release permissions'
    required: false
    default: ${{ github.token }}
  
  workspace-root:
    description: 'Workspace root directory'
    required: false
    default: ${{ github.workspace }}

outputs:
  projects-built:
    description: 'Number of projects successfully built'
    value: ${{ steps.build-pack.outputs.projects-built }}
  
  projects-packed:
    description: 'Number of projects successfully packed'
    value: ${{ steps.build-pack.outputs.projects-packed }}
  
  projects-uploaded:
    description: 'Number of projects successfully uploaded'
    value: ${{ steps.build-pack.outputs.projects-uploaded }}
  
  projects-skipped:
    description: 'Number of projects skipped (already completed)'
    value: ${{ steps.build-pack.outputs.projects-skipped }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    
    - name: Configure registry auth
      shell: bash
      run: |
        pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
        pnpm config set "verifyDepsBeforeRun" "false"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
    
    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --lockfile-dir .pnpm-prod
      env:
        HUSKY: '0'
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
    
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-build-pack...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Run Build & Pack
      shell: bash
      run: npx tsx ${{ github.action_path }}/src/action.ts
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_WORKSPACE_ROOT: ${{ inputs.workspace-root }}
        INPUT_ARTIFACT_OUTPUT_DIR: ${{ inputs.artifact-output-dir }}
