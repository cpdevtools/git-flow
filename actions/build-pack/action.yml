name: 'Build & Pack Projects'
description: 'Phase 2: Builds and packages projects from release PR, creates draft releases with artifacts'
author: 'CPDevTools'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  pr-number:
    description: 'Pull request number containing release metadata'
    required: true
  
  token:
    description: 'GitHub token with release permissions'
    required: false
    default: ${{ github.token }}
  
  workspace-root:
    description: 'Workspace root directory'
    required: false
    default: ${{ github.workspace }}
  
  artifact-output-dir:
    description: 'Directory for artifact output files'
    required: false
    default: '.artifacts'

outputs:
  projects-built:
    description: 'Number of projects successfully built'
  
  projects-packed:
    description: 'Number of projects successfully packed'
  
  projects-uploaded:
    description: 'Number of projects successfully uploaded'
  
  projects-skipped:
    description: 'Number of projects skipped (already completed)'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      shell: bash
      run: pnpm install
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Run Build & Pack
      shell: bash
      run: node ${{ github.action_path }}/dist/index.cjs
      env:
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_WORKSPACE-ROOT: ${{ inputs.workspace-root }}
        INPUT_ARTIFACT-OUTPUT-DIR: ${{ inputs.artifact-output-dir }}
