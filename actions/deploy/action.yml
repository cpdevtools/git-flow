name: 'Deploy via Deploy Gateway'
description: 'Sign and POST a deploy trigger to the deploy gateway, then stream logs until EXIT:0/EXIT:1'
author: 'CPDevTools'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  repo:
    description: 'GitHub repo (owner/repo) — defaults to current repo'
    required: false
    default: ${{ github.repository }}

  release_id:
    description: 'GitHub Release ID (numeric) or tag (e.g. @cpdevtools/my-pkg/v1.2.3)'
    required: true

  deploy_url:
    description: 'Base URL of the deploy gateway (e.g. https://deploy.example.com). Falls back to the DEPLOY_URL env var (e.g. a job-level env from vars.DEPLOY_URL).'
    required: false
    default: ''

  hmac_secret:
    description: 'HMAC shared secret for signing deploy requests. Falls back to the DEPLOY_HMAC_SECRET env var (e.g. a job-level env from secrets.DEPLOY_HMAC_SECRET).'
    required: false
    default: ''

  deploy_type:
    description: 'Deploy method (node, compose, swarm, …) selecting the deploy-<type>.zip bundle. Falls back to the DEPLOY_TYPE_DEFAULT env var, then to "node".'
    required: false
    default: ''

  bundle:
    description: 'Explicit deploy bundle asset name. Overrides deploy_type resolution. Defaults to deploy-<type>.zip (type = deploy_type || DEPLOY_TYPE_DEFAULT || node).'
    required: false
    default: ''

  environment:
    description: 'GitHub Environment name for deployment tracking (omit to skip GitHub Deployments API tracking)'
    required: false
    default: ''

  deploy_env:
    description: |
      Extra environment variables for this specific deploy, as KEY=VAL lines.
      Merged on top of the service's own environment for the duration of the
      deploy command (and every supervisor step — teardown, deploy, rollback).
      Example:
        COMPOSE_FILE=docker-compose.netns.yml
        DEPLOY_NETNS_CONTAINER=main_devcontainer-devcontainer-1
    required: false
    default: ''

  allowed_methods:
    description: |
      Newline-separated list of deploy methods permitted in this environment
      (e.g. "compose\nswarm"). When set, the action fails immediately if the
      resolved deploy method is not in the list. Leave empty to allow all methods.
      Set via the DEPLOY_ALLOWED_METHODS GitHub Environment variable — do not
      expose as a workflow_dispatch input (that would allow callers to bypass it).
    required: false
    default: ''

  token:
    description: 'GitHub token for registry auth and API access (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Configure registry auth
      shell: bash
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-deploy...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Run Deploy Action
      shell: bash
      run: |
        ${{ github.action_path }}/node_modules/.bin/tsx \
          --tsconfig ${{ github.action_path }}/tsconfig.json \
          ${{ github.action_path }}/src/action.ts
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_RELEASE_ID: ${{ inputs.release_id }}
        INPUT_DEPLOY_URL: ${{ inputs.deploy_url }}
        INPUT_HMAC_SECRET: ${{ inputs.hmac_secret }}
        INPUT_BUNDLE: ${{ inputs.bundle }}
        INPUT_DEPLOY_TYPE: ${{ inputs.deploy_type }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_DEPLOY_ENV: ${{ inputs.deploy_env }}
        INPUT_ALLOWED_METHODS: ${{ inputs.allowed_methods }}
        GITHUB_TOKEN: ${{ inputs.token }}
