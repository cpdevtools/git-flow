name: 'Publish Release'
description: 'Publish artifacts to registries and finalize GitHub releases'

inputs:
  pr-number:
    description: 'Release PR number'
    required: true
  token:
    description: 'GitHub token for API access'
    required: true

# outputs:
#   published-count:
#     description: 'Number of projects successfully published'
#   verified-count:
#     description: 'Number of projects verified'
#   failed-count:
#     description: 'Number of projects that failed'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11
    
    - name: Configure registry auth
      shell: bash
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
    
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/publish-release-action...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Run Publish Release
      shell: bash
      run: npx tsx ${{ github.action_path }}/src/action.ts
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
