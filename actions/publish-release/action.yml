name: 'Publish Release'
description: 'Publish artifacts to registries and finalize GitHub releases'

inputs:
  pr-number:
    description: 'Release PR number'
    required: true
  token:
    description: 'GitHub token for API access'
    required: true

outputs:
  published-count:
    description: 'Number of projects successfully published'
  verified-count:
    description: 'Number of projects verified'
  failed-count:
    description: 'Number of projects that failed'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Run Publish Release
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm exec tsx src/index.ts
      env:
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
