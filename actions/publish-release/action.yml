name: 'Publish Release'
description: 'Publish artifacts to registries and finalize GitHub releases'

inputs:
  pr-number:
    description: 'Release PR number'
    required: true
  token:
    description: 'GitHub token for API access'
    required: true

outputs:
  published-count:
    description: 'Number of projects successfully published'
  verified-count:
    description: 'Number of projects verified'
  failed-count:
    description: 'Number of projects that failed'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Run Publish Release
      shell: bash
      run: node ${{ github.action_path }}/dist/index.cjs
      env:
        INPUT_PR-NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
