name: 'Publish Release'
description: 'Publish artifacts to registries and finalize GitHub releases'

inputs:
  pr-number:
    description: 'Release PR number'
    required: true
  token:
    description: 'GitHub token for API access'
    required: true

# outputs:
#   published-count:
#     description: 'Number of projects successfully published'
#   verified-count:
#     description: 'Number of projects verified'
#   failed-count:
#     description: 'Number of projects that failed'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    
    - name: Configure registry auth
      shell: bash
      # verifyDepsBeforeRun=false so per-project `pnpm run` doesn't each re-run a
      # full install over the shared store in parallel and race. Matches actions/build-pack.
      run: |
        pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
        pnpm config set "verifyDepsBeforeRun" "false"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
    
    # Publish dispatches through the artifact-type registry, so any plugin the
    # repo installs has to be resolvable here too — not just at pack time. This
    # step is what puts it in node_modules; without it a plugin artifact reaches
    # publish and fails with 'Unknown artifact type'.
    - name: Install workspace dependencies
      shell: bash
      run: |
        # .pnpm-prod presence IS the per-repo migration state: repos still on the
        # dual-lockfile layout install from it; converted repos (single root
        # lockfile, dev-link overlay for local packages) do a frozen root install.
        if [ -f .pnpm-prod/pnpm-lock.yaml ]; then
          pnpm install --lockfile-dir .pnpm-prod
        else
          pnpm install --frozen-lockfile
        fi
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/publish-release-action...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Run Publish Release
      shell: bash
      run: ${{ github.action_path }}/node_modules/.bin/tsx --tsconfig ${{ github.action_path }}/tsconfig.json ${{ github.action_path }}/src/action.ts
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_TOKEN: ${{ inputs.token }}
