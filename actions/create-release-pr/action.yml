name: 'Create Release PR'
description: 'Creates or updates a release PR with metadata for version resolution'
author: 'CPDevTools'

branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  branch:
    description: 'Source branch name (default: current branch)'
    required: false
    default: ${{ github.ref_name }}
  
  token:
    description: 'GitHub token with PR permissions'
    required: false
    default: ${{ github.token }}
  
  versions-file:
    description: 'Path to versions configuration file (supports .json, .yml, .yaml)'
    required: false
    default: '.github/versions.yml'
  
  run_number:
    description: 'CI run number for build suffix'
    required: true

outputs:
  pr-number:
    description: 'Pull request number'
    value: ${{ steps.create-pr.outputs.pr-number }}
  
  pr-url:
    description: 'Pull request URL'
    value: ${{ steps.create-pr.outputs.pr-url }}
  
  release-branch:
    description: 'Name of the release branch'
    value: ${{ steps.create-pr.outputs.release-branch }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@cpdevtools'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    
    - name: Configure registry auth
      shell: bash
      run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
    
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm i --no-frozen-lockfile --filter @cpdevtools/git-flow-action-create-release-pr...
      env:
        HUSKY: '0'
        GITHUB_TOKEN: ${{ inputs.token }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
    
    - name: Run Create Release PR
      shell: bash
      run: ${{ github.action_path }}/node_modules/.bin/tsx ${{ github.action_path }}/src/action.ts
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_VERSIONS_FILE: ${{ inputs.versions-file }}
        INPUT_RUN_NUMBER: ${{ inputs.run_number }}
