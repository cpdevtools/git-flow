# Registry configuration for publish-release
# Place this file at: .publish/registries.yml
#
# `auth` (and `usernameEnv`) name ENVIRONMENT VARIABLES read at publish time —
# never put a token value here.

registries:
  # NPM Registry (npmjs.com)
  npm:
    type: npm
    url: https://registry.npmjs.org
    auth: NPM_TOKEN # Environment variable name containing auth token
    scope: '@cpdevtools' # Optional: NPM scope for scoped packages

  # GitHub Packages (NPM)
  github-npm:
    type: npm
    url: https://npm.pkg.github.com
    auth: GITHUB_TOKEN
    scope: '@cpdevtools'

  # NuGet.org
  nuget:
    type: nuget
    url: https://api.nuget.org/v3/index.json
    auth: NUGET_API_KEY

  # GitHub Packages (NuGet)
  github-nuget:
    type: nuget
    url: https://nuget.pkg.github.com/cpdevtools/index.json
    auth: GITHUB_TOKEN

  # Docker Hub
  dockerhub:
    type: docker
    registry: docker.io
    namespace: cpdevtools # Optional: Docker Hub username/org
    auth: DOCKERHUB_TOKEN
    usernameEnv: DOCKERHUB_USERNAME # Optional: separate username env var

  # GitHub Container Registry (ghcr.io)
  ghcr:
    type: docker
    registry: ghcr.io
    namespace: cpdevtools
    auth: GITHUB_TOKEN

  # Azure Container Registry
  acr:
    type: docker
    registry: myregistry.azurecr.io
    auth: ACR_TOKEN
    usernameEnv: ACR_USERNAME

# How to reference registries from a project's release-artifacts.yml:
# artifacts:
#   - type: npm
#     name: '${PACKAGE_NAME}'
#     registries: [npm, github-npm]  # Publish to both registries
#
#   - type: docker-image
#     name: my-app                   # bare repository name — host and namespace
#     registries: [ghcr, dockerhub]  # come from each registry entry above
#
# Pack saves the image with `docker save | gzip` and records `finalTag` (the
# release version) and `digest`; publish loads, verifies, tags and pushes it.
# Nothing is pushed to a registry at pack time.

# Workflow usage:
# - uses: cpdevtools/git-flow/actions/publish-release@main
#   with:
#     pr-number: ${{ github.event.pull_request.number }}
#     token: ${{ secrets.GITHUB_TOKEN }}
#   env:
#     # Pass all tokens as environment variables
#     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
#     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
#     DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
#     DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
