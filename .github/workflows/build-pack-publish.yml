name: Build, Pack & Publish Release

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Release PR number'
        required: true
        type: number
      
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '20'
    
    outputs:
      published-count:
        description: 'Number of projects successfully published'
        value: ${{ jobs.publish.outputs.published-count }}
      
      verified-count:
        description: 'Number of projects verified'
        value: ${{ jobs.publish.outputs.verified-count }}

jobs:
  build-pack:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup git-flow CLI
        run: |
          cd /home/runner/work/_actions/cpdevtools/git-flow/main/packages/git-flow
          # Install only production dependencies needed for CLI
          npm install --production --ignore-scripts
          # Symlink to PATH
          mkdir -p /home/runner/.local/bin
          ln -s /home/runner/work/_actions/cpdevtools/git-flow/main/packages/git-flow/dist/cli/bin.js /home/runner/.local/bin/cpdt-gitflow
          chmod +x /home/runner/.local/bin/cpdt-gitflow
          echo "/home/runner/.local/bin" >> $GITHUB_PATH
      
      - name: Build & Pack
        uses: cpdevtools/git-flow/actions/build-pack@main
        with:
          pr-number: ${{ inputs.pr-number }}
          token: ${{ secrets.GITHUB_TOKEN }}
  
  publish:
    needs: build-pack
    runs-on: ubuntu-latest
    
    outputs:
      published-count: ${{ steps.publish.outputs.published-count }}
      verified-count: ${{ steps.publish.outputs.verified-count }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Publish Release
        id: publish
        uses: cpdevtools/git-flow/actions/publish-release@main
        with:
          pr-number: ${{ inputs.pr-number }}
          token: ${{ secrets.GITHUB_TOKEN }}
