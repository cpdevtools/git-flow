name: Build, Pack & Publish Release

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Release PR number'
        required: true
        type: number
      
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '20'
    
    outputs:
      published-count:
        description: 'Number of projects successfully published'
        value: ${{ jobs.publish.outputs.published-count }}
      
      verified-count:
        description: 'Number of projects verified'
        value: ${{ jobs.publish.outputs.verified-count }}

jobs:
  build-pack:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install CLI dependencies in action directory
        run: |
          # Install in temp dir to avoid package.json with link: protocol
          TEMP_DIR=$(mktemp -d)
          cd $TEMP_DIR
          npm install --no-save @oclif/core@^4.8.0 @actions/core@^1.11.1 @actions/github@^6.0.0 globby@^14.0.2 semver@^7.6.3 yaml@^2.8.2 zx@^8.2.4
          # Move to action directory
          mv node_modules /home/runner/work/_actions/cpdevtools/git-flow/main/packages/git-flow/
      
      - name: Symlink bundled git-flow CLI to PATH
        run: |
          echo "=== Debugging action checkout ==="
          echo "Working directory: $(pwd)"
          echo "Action directory structure:"
          find /home/runner/work/_actions/cpdevtools/git-flow/main -type f | head -20
          
          echo "=== Checking for git-flow package ==="
          ls -la /home/runner/work/_actions/cpdevtools/git-flow/main/packages/ || echo "No packages directory"
          
          echo "=== Checking for CLI files ==="
          find /home/runner/work/_actions/cpdevtools/git-flow/main -name "bin.js" || echo "No bin.js found"
          
          echo "=== Attempting symlink ==="
          CLI_PATH="/home/runner/work/_actions/cpdevtools/git-flow/main/packages/git-flow/dist/cli/bin.js"
          if [ -f "$CLI_PATH" ]; then
            echo "CLI file exists, creating symlink"
            sudo ln -s "$CLI_PATH" /usr/local/bin/cpdt-gitflow
            sudo chmod +x /usr/local/bin/cpdt-gitflow
            echo "Symlink created successfully"
          else
            echo "ERROR: CLI file not found at $CLI_PATH"
            exit 1
          fi
      
      - name: Build & Pack
        uses: cpdevtools/git-flow/actions/build-pack@main
        with:
          pr-number: ${{ inputs.pr-number }}
          token: ${{ secrets.GITHUB_TOKEN }}
  
  publish:
    needs: build-pack
    runs-on: ubuntu-latest
    
    outputs:
      published-count: ${{ steps.publish.outputs.published-count }}
      verified-count: ${{ steps.publish.outputs.verified-count }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Publish Release
        id: publish
        uses: cpdevtools/git-flow/actions/publish-release@v1.0.0-cjs.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr-number: ${{ inputs.pr-number }}
          token: ${{ secrets.GITHUB_TOKEN }}
