name: Test

on:
  push:
    branches-ignore:
      - 'release/**'

permissions:
  contents: write  # Push test-pass tags
  checks: write    # Write step summaries / check runs
  actions: read    # Read workflow context

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # Full history — needed for git diff in change detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Tests
        uses: ./actions/test
        with:
          mode: test-optional
          skip-unchanged: true
          rerun-all: ${{ github.event.inputs.rerun-all || 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
