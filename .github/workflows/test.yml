name: Test

on:
  push:
    branches-ignore:
      - 'release/**'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write # Write step summaries / check runs
  actions: read # Read workflow context
  packages: read # Install from GitHub Package Registry

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        uses: ./actions/test
        with:
          mode: test-optional
          fail-fast: ${{ github.event.inputs.fail-fast || 'false' }}
          concurrency: ${{ github.event.inputs.concurrency || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # The library and actions must also work on a Windows runner: toolchains that
  # cannot cross-compile (PyInstaller) release from windows-latest.
  test-windows:
    name: Test (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        uses: ./actions/test
        with:
          mode: test-optional
          fail-fast: ${{ github.event.inputs.fail-fast || 'false' }}
          concurrency: ${{ github.event.inputs.concurrency || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
