name: Deploy — Deploy Test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_id:
        description: 'GitHub Release ID to deploy'
        required: true
        type: string
      bundle:
        description: 'Deploy bundle asset name (leave blank for environment default)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      repo: ${{ github.repository }}
      release_id: ${{ github.event.release.id || inputs.release_id }}
      environment: 'Deploy Test'
      bundle: ${{ inputs.bundle || '' }}
    secrets: inherit
