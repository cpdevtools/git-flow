name: Cleanup Old Build Versions

on:
  workflow_call:
    inputs:
      days_old:
        description: 'Delete builds older than X days'
        type: string
        default: '14'
      dry_run:
        description: 'Dry run (show what would be deleted without deleting)'
        type: string
        default: 'false'
    secrets:
      token:
        description: 'GitHub token with packages:write and contents:write'
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: ./actions/cleanup-old-builds
        with:
          days-old: ${{ inputs.days_old }}
          dry-run: ${{ inputs.dry_run }}
          token: ${{ secrets.token || github.token }}
